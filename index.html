<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abdallah Wageeh | Full Stack Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "canvas-light": "#f2f2f0",
              "canvas-dark": "#0a0a0b",
              electric: "#3d7fff",
              "electric-glow": "rgba(61, 127, 255, 0.6)",
              success: "#22c55e",
              error: "#ef4444",
              warning: "#f59e0b",
              slate: "#64748b",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Space Grotesk", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            spacing: {
              '360': '90rem',
            },
            backgroundImage: {
              noise: "none",
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f2f2f0;
        color: #0a0a0b;
        font-family: 'Inter', sans-serif;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .grain-overlay {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 60;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react/": "https://esm.sh/react@18.2.0/",
          "react-dom": "https://esm.sh/react-dom@18.2.0",
          "react-dom/": "https://esm.sh/react-dom@18.2.0/",
          "lucide-react": "https://esm.sh/lucide-react@0.292.0",
          "yup": "https://esm.sh/yup@1.3.2",
          "formik": "https://esm.sh/formik@2.4.5",
          "three": "https://esm.sh/three@0.160.0",
          "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
          "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber",

          "framer-motion": "https://esm.sh/framer-motion@10.16.4"
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        /* --- CARDS --- */
        .card-base {
          @apply bg-white rounded-xl ring-1 ring-canvas-dark/10 shadow-md;
        }
        .card-hover {
          @apply hover:shadow-xl hover:-translate-y-1 transition-all duration-300;
        }

        /* --- BUTTONS --- */
        .btn-primary {
          @apply bg-electric text-white rounded-full font-medium hover:bg-electric/80 transition-colors duration-300 px-6 py-3 flex items-center justify-center gap-2;
        }
        .btn-secondary {
          @apply bg-canvas-dark text-canvas-light rounded-full font-medium hover:bg-canvas-dark/80 transition-colors duration-300 px-6 py-3 flex items-center justify-center gap-2;
        }
        .btn-outline {
          @apply border border-canvas-dark/15 text-canvas-dark/80 rounded-full font-medium hover:text-electric hover:border-electric transition-colors duration-300 px-6 py-3 flex items-center justify-center gap-2;
        }

        /* --- INPUTS --- */
        .input-base {
          @apply w-full bg-white shadow-sm ring-1 ring-canvas-dark/5 border border-canvas-dark/20 rounded-xl p-4 text-canvas-dark/90 focus:outline-none focus:border-electric focus:ring-1 focus:ring-electric transition-all disabled:opacity-50;
        }
        
        /* --- SECTION CONTAINERS --- */
        .section-container {
          @apply py-24 md:py-32 w-full max-w-7xl mx-auto px-6 md:px-12 lg:px-24;
        }
      }

      @layer utilities {
        .text-primary { @apply text-canvas-dark/90; }
        .text-secondary { @apply text-canvas-dark/70; }
        .text-muted { @apply text-canvas-dark/50; }
        .text-ghost { @apply text-canvas-dark/30; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
